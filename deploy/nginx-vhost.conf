# Forge production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "No product frontend found; keep API behind internal network/admin token."
#
# Forge has no operator UI and no public DNS record or TLS certificate, so
# this vhost is plain HTTP restricted to the Tailscale tailnet
# (100.64.0.0/10). The API additionally enforces the admin token at the
# application. The Hub proxies Forge server-side over 127.0.0.1:8788.

server {
    listen 80;
    server_name forge.rajeev.me;

    # Internal-only: deny everything outside the tailnet.
    allow 100.64.0.0/10;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
